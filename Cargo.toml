[package]
name = "sshmount"
version = "0.3.3"
edition = "2024"
authors = ["mito"]
description = "Mount the directory to which the ssh connection is made."
license = "Apache-2.0"
keywords = ["utility", "filesystem", "linux", "ssh", "sftp"]
categories = ["command-line-utilities", "filesystem"]
repository = "https://github.com/mitoneko/sshmount.git"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
daemonize = "0.5.0"
dialoguer = "0.12.0"
dns-lookup = "4.0.1"
env_logger = "0.11.11"
fluent-uri = { version = "0.4.1", features = ["net"] }
fuser = "0.18"
home = "0.5.12"
libc = "0.2.189"
log = "0.4.34"
shellexpand = "3.1.2"
ssh2 = "0.9.6"
ssh2-config = "0.8.0"
thiserror = "2.0"
users = "0.11.0"

[profile.release]
codegen-units = 1
opt-level = "s"
lto = "thin"
panic = "abort"
strip = "symbols"
