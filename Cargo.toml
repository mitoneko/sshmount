[package]
name = "sshmount"
version = "0.4.0"
edition = "2024"
authors = ["mito"]
description = "Mount the directory to which the ssh connection is made."
license = "Apache-2.0"
keywords = ["utility", "filesystem", "linux", "ssh", "sftp"]
categories = ["command-line-utilities", "filesystem"]
repository = "https://github.com/mitoneko/sshmount.git"
readme = "README.md"
exclude = [
    "/.github/**",
    "/tex/**",
    "/tests/test.env.sampl",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0"
clap = { version = "4.6.7", features = ["derive"] }
daemonize = "0.5.0"
dialoguer = "0.12.0"
dns-lookup = "4.0.1"
#env_logger = "0.11.11"
log = "0.4.34"
systemd-journal-logger = "2.2.2"
fluent-uri = { version = "0.4.1", features = ["net"] }
home = "0.5.12"
users = "0.11.0"
libc = "0.2.189"
shellexpand = "3.1.2"
ssh2 = "0.9.6"
ssh2-config = "0.8.0"
fuser = "0.18"
rand = "0.10.3"

[dev-dependencies]
uuid = { version = "1.27.0", features = ["v7", "std"] }
blake3 = "1.8.7"

[profile.release]
codegen-units = 1
opt-level = "s"
lto = "thin"
#panic = "abort"
strip = "debuginfo"
